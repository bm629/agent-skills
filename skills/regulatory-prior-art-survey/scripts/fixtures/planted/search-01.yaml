  authority: primary-law
  binding_force: law
  locator: https://www.ecfr.gov/api/versioner/v1/full/2026-01-01/title-45.xml?part=160
  retrieved_at: '2026-09-02'
  as_of: null
  source_claimed_modified_at: null
  source_claim_provenance: absent
  evidence_quote: '"A covered entity or business associate must keep such records and submit such compliance
    reports, in such time and manner and containing such information, as the Secretary may determine to
