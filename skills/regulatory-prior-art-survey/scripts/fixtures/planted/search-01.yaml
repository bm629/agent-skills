- item_id: CELEX-32016R0679
  id_class: CELEX
  found_by: gdpr/eu-cellar
  name: GDPR
  authority: primary-law
  binding_force: law
  locator: http://publications.europa.eu/resource/celex/32016R0679
  retrieved_at: '2026-09-02'
  as_of: null
  source_claimed_modified_at: null
  source_claim_provenance: absent
  evidence_quote: '"In the case of a personal data breach, the controller shall without undue delay and,
    where feasible, not later than 72 hours after having become aware of it, notify the personal data
    breach to the supervisory authority competent in accordance with Article 55, unless the personal data
    breach is unlikely to result in a risk to the rights and freedoms of natural persons. Where the notification
    to the supervisory authority is not made within 72 hours, it shall be accompanied by reasons for the
    delay."

    '
  claim: 'The act states a notification duty on the controller that is GATED on risk — it does not apply
    where the breach is unlikely to result in a risk to rights and freedoms — with 72 hours as an outer
    limit that may be overrun if the delay is reasoned. Not an unconditional hard stop: an incident path
    built as one implements a duty the act does not impose, and misses the assessment the act does.

    '
  text_retrievable: full-text
  in_force_date: '2018-05-25'
  jurisdiction: European Union
  issuing_body: European Parliament and Council
  instrument_type: regulation
  finding: null
  provenance:
    celex: 32016R0679
    eli: http://data.europa.eu/eli/reg/2016/679/oj
    cfr_citation: null
    standard_number: null
    doi: null
  notes: []
- item_id: CFR-45-164
  id_class: CFR
  found_by: hipaa-security-rule/ecfr-api
  name: HIPAA Security Rule
  authority: primary-law
  binding_force: law
  locator: https://www.ecfr.gov/api/versioner/v1/full/2026-01-01/title-45.xml?part=164&subpart=C
  retrieved_at: '2026-09-02'
  as_of: null
  source_claimed_modified_at: null
  source_claim_provenance: absent
  evidence_quote: '"Implement technical policies and procedures for electronic information systems that
    maintain electronic protected health information to allow access only to those persons or software
    programs that have been granted access rights as specified in § 164.308(a)(4)."

    '
  claim: 'The rule states an access-control duty over systems holding ePHI and cross-references the workforce-authorisation
    standard for who may be granted rights. The standard''s own implementation specifications at §164.312(a)(2)
    then name four mechanisms — unique user identification and emergency access are REQUIRED, automatic
    logoff and encryption are addressable — so the architecture choice is bounded rather than open.

    '
  text_retrievable: full-text
  in_force_date: null
  jurisdiction: United States
  issuing_body: Department of Health and Human Services
  instrument_type: rule
  finding: 'No retention period is stated for AUDIT RECORDS specifically. The same subpart does state
    one for required documentation — six years at §164.316(b)(2)(i) — and whether audit logs fall inside
    that provision''s "record of the action, activity, or assessment" is the open question. A logging
    design resolves it inside this subpart, not from another instrument.

    '
  provenance:
    celex: null
    eli: null
    cfr_citation: 45 CFR 164 subpart C
    standard_number: null
    doi: null
  notes: []
