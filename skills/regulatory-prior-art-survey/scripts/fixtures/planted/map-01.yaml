  revision: 1
  scope_ref: 'A telehealth platform for EU and US consumers. Patients book and hold video consultations,
    upload documents, and a pre-trained model triages intake forms to a clinician queue. Deployed multi-region.
    Not a marketplace and not a payments network.

    '
  classification:
    regulatory.applies: true
    domain.audience: b2c
    domain.open_to_public: true
    archetype.primary: web-app
    data_ml.ml_involvement: uses-pre-trained
    ui.has_ui: true
    ui.complexity: moderate
    business.platform.type: none
    scale.geo_distribution: multi-region
    security.data_sensitivity.level: high
