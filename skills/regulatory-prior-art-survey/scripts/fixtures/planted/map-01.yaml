assumptions:
- '"Multi-region" is read as EU-and-US rather than as two EU regions. The scope names EU and US consumers,
  so the transfer question is real; had it meant two EU regions, b4 would still hold on the declared value
  but its corpus would be near-empty.

  '
- 'The triage model is read as assisting a clinician rather than deciding care. That reading keeps the
  scope off the AI Act''s high-risk annexes; b1 records the classification and its evidence rather than
  assuming it.

  '
notes:
- 'Two hosts of one body disagree in this registry: www.hhs.gov is blocked while ocrportal.hhs.gov answers.
  The HIPAA rules themselves are at ecfr-api, so the block costs enforcement facts, not the rule text.

  '
