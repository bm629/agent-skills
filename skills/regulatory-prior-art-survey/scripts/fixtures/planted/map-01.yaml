probe:
  ran: true
  note: 'Four probes before dispatching eight angles. (1) `eu-cellar` resolved CELEX 32016R0679 at 200
    under the Accept/Accept-Language pair, 806,864 bytes, so the EU channel and the header pair both work.
    (2) The same URI with `Accept: text/html` returned 404, which is why the pair is recorded on the row
    rather than assumed. (3) `ecfr-api` returned the title-45 structure document at 200, so `45 CFR 164`
    is reachable by identifier. (4) `edpb`''s legacy `/our-work-tools/...` guidance path 301''d to `/public-consultations_en`
    and answered 200 — a DIFFERENT page — so the guidance URL used here is `/documents_en`, and the trap
    is recorded in `notes` for every angle that touches this source.

    '
sector_scoping:
- family: health
  applies: applies
  evidence: '`security.data_sensitivity.level: high` with a scope that stores consultation records and
    intake forms. The scope prose names patients and clinicians directly.

    '
  instruments:
  - HIPAA Security Rule
  - GDPR Article 9
- family: financial-payments
  applies: undetermined
  evidence: 'The scope says consultations are booked but names no payment flow, and `business.platform.type`
    is `none`. Whether the platform takes payment itself or hands off to a processor decides this, and
    the scope does not say. Recorded as undetermined rather than guessed either way.

    '
  instruments: []
- family: children-minors
  applies: undetermined
  evidence: '`domain.audience: b2c` and `open_to_public: true`, and no field distinguishes a minors-facing
    product from any other consumer one. A telehealth service plausibly sees paediatric patients; the
    scope does not say whether it accepts them.

    '
  instruments: []
- family: public-sector
  applies: does-not-apply
  evidence: '`domain.audience: b2c`; no government customer is named anywhere in the scope.'
  instruments: []
- family: employment-hr
  applies: does-not-apply
  evidence: '`domain.audience: b2c` means a consumer product, and the scope describes no employee-data
    processing beyond what any employer does incidentally.

    '
  instruments: []
- family: insurance
  applies: undetermined
  evidence: 'Telehealth in the US is commonly billed through insurers, which would pull in claims-data
    rules, but the scope names no insurer relationship.

    '
  instruments: []
- family: education
  applies: does-not-apply
  evidence: No educational institution, student record or minor-in-education context in the scope.
  instruments: []
- family: telecom-critical-infrastructure
  applies: does-not-apply
  evidence: 'A consumer web application, not a network operator or an essential-services entity. Video
    consultation rides on a third party''s transport rather than providing it.

    '
  instruments: []
- family: export-controlled
  applies: does-not-apply
  evidence: No cryptographic export, dual-use technology or controlled dataset in the scope.
  instruments: []
scope_guard:
  excluded:
  - item: medical device regulation (MDR)
    reason: 'The scope triages intake forms to a queue; it states no diagnostic or therapeutic claim,
      which is what would place software under MDR. Recorded because the boundary is close and a later
      scope change could cross it, not because it was overlooked.

      '
  - item: employment law
    reason: '`domain.audience: b2c`. Folded into a1''s sector sub-topic per L-10 rather than searched,
      because no capability-map field discriminates it.

      '
  absent_types:
  - platform-role
  shared_terms:
  - term: HIPAA
    groups:
    - health
    - hipaa-security-rule
    owner: hipaa-security-rule
angle_applicability:
- angle_id: a1
  precondition: always applicable
  holds: true
  reason: Always-on; it has no precondition to fail, and both the instrument and sector axes are populated.
- angle_id: a2
  precondition: always applicable
  holds: true
  reason: 'Always-on. `security.data_sensitivity.level: high` makes the supervisory guidance layer decisive
    here rather than incidental.'
- angle_id: a3
  precondition: always applicable
  holds: true
  reason: Always-on; the control-catalog axis carries two named catalogs the scope's instruments incorporate.
- angle_id: b1
  precondition: data_ml.ml_involvement != "none"
  holds: true
  reason: '`data_ml.ml_involvement` is `uses-pre-trained`, which is in the set the precondition admits.'
- angle_id: b2
  precondition: ui.has_ui = true
  holds: true
  reason: '`ui.has_ui` is true. No `ui.accessibility.required_level` was handed in, so the level defaults
    to AA.'
- angle_id: b3
  precondition: business.platform.type != "none"
  holds: false
  reason: '`business.platform.type` is `none` — the deciding value, falsifying the only leg. The scope
    intermediates between patients and clinicians in ordinary language, but not in the sense the platform
    instruments define, and the declared field is what the predicate reads.

    '
- angle_id: b4
  precondition: scale.geo_distribution in {multi-region, global, edge}
  holds: true
  reason: '`infrastructure.data_residency` is declared with an EU-only requirement, and the scope deploys
    outside it, so the transfer corpus is in scope.'
- angle_id: b5
  precondition: 'business.platform.type = "payments-network" OR (archetype.primary = "api-service" AND
    regulatory.frameworks names a financial instrument)

    '
  holds: false
  reason: 'Both disjuncts are false against handed values: `business.platform.type` is `none`, and `archetype.primary`
    is `web-app` rather than `api-service`. No `regulatory.frameworks` was handed in, so the second leg''s
    widener could not have rescued it either.

    '
