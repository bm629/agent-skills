# Master source registry — platform-ecosystem prior-art survey, wave 1.
#
# Versioned because corpora move and access terms change. EVERY row's access status was verified
# at the primary source on the stated date — not inherited from a sibling type and not carried
# forward from an earlier pass. Eleven days between two verification runs moved four URLs, flipped
# one row from 404 to 403, and gave a previously-undated page a date.
#
# `cap` is sized to the corpus each angle actually walks and is NOT uniform: a cap below an
# angle's enumerable set truncates a corpus it could have walked completely.
#
# EVERY row names a fallback, and none names one that FAILS TO RESOLVE — two were found carried
# as though they did. Ten rows name THEMSELVES, which is a record, not an oversight: no distinct
# second channel exists for that material. Read a self-fallback as "there is no fallback", never
# as "retry the same URL" — for `salesforce-appexchange`, a row `blocked` on a 403, retrying is
# exactly the wrong reading. Two angles (a4, b3) name a fallback that is also one of their own
# sources, which means the same thing at the angle level.

registry_version: 1
updated: "2026-09-01"

# The TYPE-level trigger, transcribed ONCE from the formula table and checked by the same
# enumerator that uses it. An angle predicate entailed by this fires for every project the survey
# runs on, which is why each conditional below names a PROPER SUBSET of the seven
# live enum values rather than restating "is a platform at all".
type_trigger:
  formula: "business.platform.type != 'none'"
  source: "agent-flow/features/capability-map/prior-art-triggers/playbook.md §2.1"
  predicate:
    - [{field: business.platform.type, op: not_in, values: [none]}]

# None needed. The five scale.* fields are independent required enums and every witness in this
# type's trigger table is an ordinary system rather than a merely schema-legal one, so there is no
# incoherent-map hole to close. An axiom that is not load-bearing can only remove witnesses and
# manufacture a false `angle-always-fires`.
coherence_axioms: []

angles:
  - id: a1
    name: platform boundary-resource documentation traversal
    trigger: always
    precondition: always applicable
    cap: 12
    ordering_signal: platform ecosystem size, then documentation depth
    mechanism: >
      Read each platform's own developer documentation for its boundary resources — the APIs, SDKs
      and extension surfaces a complementor builds against. Prefer the machine-readable variant
      where one exists, and record WHICH variant was read: the variant is a channel with its own
      death rate, not a stable substrate.
    sources: [shopify-dev, vscode-api, slack-docs, chrome-ext, wp-plugins, figma-plugins, notion-dev, zapier-platform, stripe-connect, atlassian-marketplace, github-marketplace]
    fallback: vscode-docs-repo
    fallback_rationale: >
      A git-hosted docs source survives a site reorganisation, which is the failure mode that moved
      four of these hosts inside eleven days.

  - id: a2
    name: marketplace program-policy + commercial-terms retrieval
    trigger: always
    precondition: always applicable
    cap: 12
    ordering_signal: bindingness (developer agreement > program policy > guidance), then recency
    mechanism: >
      Read the binding developer agreement and program policy for each marketplace — revenue split,
      review gates, delisting powers. Record the ABSENCE of a stated commission rate as a finding,
      not as a gap: three platforms in this corpus publish none.
    sources: [cws-policies, apple-review, mozilla-policies, wp-guidelines, play-policies, hubspot-listing, shopify-revshare]
    fallback: chromium-ext-group
    fallback_rationale: >
      An announcement archive carries policy changes even when the policy page itself is undated.

  - id: a3
    name: declarative-contract enumeration
    trigger: always
    precondition: always applicable
    cap: 14
    ordering_signal: whether the artifact is vendor-published, then schema completeness
    mechanism: >
      Enumerate the declarative contract each platform publishes — manifest fields, contribution
      points, permission scopes. A count is meaningless without its FRAME: record which artifact,
      which extraction method, which conditional branch, and reconcile against a SECOND independent
      derivation. One extraction of a machine-readable catalog produced a well-formed row that did
      not exist; only mechanical re-derivation caught it.
    sources: [vscode-manifest, vscode-contrib, chrome-ext, figma-plugins]
    fallback: figma-plugin-typings
    fallback_rationale: >
      A vendor-owned typings package is first-party, machine-readable, and carries its own version
      tag — the only source here carrying its own version tag — record it in the candidate's `enumeration.branch`, which is where a version-scoped count states its frame.

  - id: a4
    name: platform-change forensics
    trigger: always
    precondition: always applicable
    cap: 12
    ordering_signal: enforcement date, then announcement-to-enforcement interval
    mechanism: >
      Read migration announcements and deprecation timelines. The interval between announcement and
      enforcement is the most useful number a platform's history yields, and no sibling survey type
      has an equivalent angle.
    sources: [chromium-ext-group, chrome-mv2-timeline, mozilla-policies]
    fallback: chromium-ext-group
    fallback_rationale: >
      A mailing-list archive outlives the doc page that summarised it; this corpus already contains
      one 404 where a summary page was the only record of an event.

  - id: b1
    name: third-party code-execution + isolation-model retrieval
    trigger: conditional
    precondition: >
      business.platform.type in {app-store, dev-platform} — the two values whose platforms actually
      execute complementor code in a host process
    trigger_anchor: [business.platform.type]
    predicate:
      - [{field: business.platform.type, op: in, values: [app-store, dev-platform]}]
    cap: 8
    ordering_signal: isolation strength, then whether the model is documented normatively
    mechanism: >
      Retrieve the isolation and permission model — sandbox boundary, capability grants, what a
      complementor can reach in the host. Only relevant where third-party code runs in-process.
    sources: [chrome-ext, vscode-api, figma-plugins]
    fallback: webextensions-cg
    fallback_rationale: >
      A standards-body issue tracker records isolation debates the vendor docs state only as
      conclusions.

  - id: b2
    name: platform-regulation + compliance-delegation retrieval
    trigger: conditional
    precondition: >
      business.platform.type in {marketplace, app-store, payments-network} OR regulatory.applies
    trigger_anchor: [business.platform.type, regulatory.applies]
    predicate:
      - [{field: business.platform.type, op: in, values: [marketplace, app-store, payments-network]}]
      - [{field: regulatory.applies, op: is_true}]
    cap: 10
    ordering_signal: instrument bindingness, then jurisdiction reach
    mechanism: >
      Retrieve the regulatory obligations a platform carries and what it delegates to complementors
      — gatekeeper duties, payment rules, compliance pass-through.
    sources: [stripe-connect, apple-review, play-policies]
    fallback: eur-lex-dma-summary
    fallback_rationale: >
      The EUR-Lex CELEX endpoint returns HTTP 202 with a zero-byte body to every client tried, so
      the full-text route is NOT usable and the summary page is the resolving substitute. Recorded
      because the unusable route was previously carried as though it worked.

  - id: b3
    name: complementor-side experience mining
    trigger: conditional
    precondition: >
      business.platform.type in {marketplace, app-store, dev-platform} — the three values with a
      complementor population large enough to have a public experience record
    trigger_anchor: [business.platform.type]
    predicate:
      - [{field: business.platform.type, op: in, values: [marketplace, app-store, dev-platform]}]
    cap: 10
    ordering_signal: whether the platform hosts the forum itself, then thread recency
    mechanism: >
      Mine the complementor's own account of building on the platform — review turnarounds,
      breaking changes, migration cost — from forums the PLATFORM hosts, never from aggregators.
    sources: [chromium-ext-group, vscode-docs-repo]
    fallback: chromium-ext-group
    fallback_rationale: >
      Named concretely: an earlier revision said "the platform's own GitHub Discussions", which
      names no host and so resolves to nothing.

