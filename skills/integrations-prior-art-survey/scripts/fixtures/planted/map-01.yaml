probe:
  ran: true
  note: 'Three requests, 2026-09-03. nango-providers returned 200 with 990 providers over 31 categories;
    apis-guru returned 200 with 2,529 descriptors over 677 providers; resolving `salesforce` from the
    map''s own service group returned a first-party developer-docs host. All three reached, so no angle
    was dispatched against a vocabulary that reaches nothing.

    '
scope_guard:
  excluded:
  - item: reporting-dashboards
    reason: 'A capability the product carries that implies no third-party integration — it renders the
      product''s own data. Recorded here rather than mapped to a category group, which is what the capability-coverage
      obligation requires.

      '
  absent_types: []
  shared_terms:
  - term: booking
    groups:
    - g-cat-scheduling
    - g-noun-meeting
    owner: g-cat-scheduling
angle_applicability:
- angle_id: a1
  holds: true
  reason: 'Always-on: connector-catalog enumeration runs on every survey this type triggers.'
- angle_id: a2
  holds: true
  reason: 'Always-on: API-descriptor retrieval runs on every survey this type triggers.'
- angle_id: a3
  holds: true
  reason: 'Always-on: first-party directory reading runs on every survey this type triggers.'
- angle_id: b1
  holds: true
  reason: archetype.primary is api-service, one of the three archetypes whose consumers reach for an SDK
    first.
- angle_id: b2
  holds: true
  reason: 'All three disjuncts hold: scale.real_time is near, archetype.primary is api-service, and integrations.complexity
    is complex. Any one of them would suffice.

    '
- angle_id: b3
  holds: true
  reason: regulatory.applies is true, so the regulated-integration constraints angle holds.
- angle_id: b4
  holds: true
  reason: integrations.complexity is complex, which is b4's entire predicate.
- angle_id: b5
  holds: false
  reason: 'The DECIDING values are archetype.primary = api-service (not agent-automation) and data_ml.ml_involvement
    = none. Neither disjunct holds, so the agent-channel angle is ruled out.

    '
