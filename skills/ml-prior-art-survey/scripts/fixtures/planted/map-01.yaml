    cause: 'Returned 429 on the wave-0 probe. That is this source''s normal operating condition rather
      than an outage, and a4 reaches the same literature through crossref and openalex.

      '
assumptions:
- '"reply drafting" is read as text-generation rather than as a retrieval task, because the scope describes
  composing a reply rather than selecting a canned one. If it were retrieval, the text-generation group
  would be dropped and a1''s cap would fall on the other two tasks.

  '
notes:
- 'The Croissant endpoint was open on 2026-08-21 and is 401 today. That is a corpus fact rather than
  a scope reading, which is why it is here and not in `assumptions`.

  '
