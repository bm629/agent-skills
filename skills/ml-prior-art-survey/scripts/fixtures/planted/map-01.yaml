schema_version: 1
meta:
  retrieved_at: '2026-09-02'
  revision: 1
  scope_ref: a customer-support product adding automatic ticket triage and reply drafting, b2b, moderate
    complexity
groups:
- id: text-classification
  type: ml-task
  canonical: text-classification
  borrowed_from: huggingface-pipeline-tag
  expansions:
  - sequence classification
  - intent detection
  - ticket routing
  expansion_cap: 4
  negative_terms:
  - image classification
- id: summarization
  type: ml-task
  canonical: summarization
  borrowed_from: huggingface-pipeline-tag
  expansions:
  - abstractive summarization
  - text summarization
  expansion_cap: 4
  negative_terms: []
- id: text-generation
  type: ml-task
  canonical: text-generation
  borrowed_from: huggingface-pipeline-tag
  expansions:
  - causal language modeling
  - reply drafting
  - response generation
  expansion_cap: 4
  negative_terms:
  - image generation
- id: modality-text
  type: modality
  canonical: text
  expansions: []
  expansion_cap: 1
  negative_terms: []
- id: support-ticket
  type: domain-term
  canonical: support ticket
  expansions:
  - helpdesk ticket
  - service request
  - customer enquiry
  expansion_cap: 4
  negative_terms:
  - ticket sales
  - event ticket
- id: intent-benchmarks
  type: benchmark
  canonical: banking77
  expansions:
  - clinc150
  - hwu64
  expansion_cap: 3
  negative_terms: []
- id: support-corpora
  type: dataset
  canonical: customer support dialogue corpus
  expansions:
  - helpdesk dialogue dataset
  - conversational support corpus
  expansion_cap: 3
  negative_terms: []
- id: encoder-finetune
  type: method
  canonical: encoder fine-tuning
  expansions:
  - DeBERTa-v3-base
  - RoBERTa-large
  - sentence-transformers
  expansion_cap: 4
  negative_terms: []
probe:
  ran: true
  note: 'Probed `text-classification` against huggingface-hub-api before dispatch: 200 with a non-empty
    model list on the first page. The vocabulary reaches the corpus, so the nine angles are worth dispatching.
    `support-ticket` returned far fewer hits than the task terms, which is why its expansions carry
    three domain synonyms rather than one.

    '
scope_guard:
  excluded:
  - item: speech-to-text
    reason: 'The scope''s tickets arrive as text through a web form and an email gateway; no audio channel
      exists, so an ASR model has nothing to transcribe here. Recorded rather than left out in silence.

      '
  - item: multilingual translation
    reason: 'The product serves one locale at launch. A translation model would be surveyed against
      a requirement the scope does not have, and its results would compete for the cap with models the
      scope can use.

      '
  absent_types:
  - harm-category
  - runtime-format
angle_applicability:
- angle_id: a1
  precondition: always applicable
  holds: true
  reason: Always-on; it has no precondition to fail, and the Hub carries all three task groups.
- angle_id: a2
  precondition: always applicable
  holds: true
  reason: Always-on; the scope needs labelled support dialogue and the dataset axis is populated.
- angle_id: a3
  precondition: always applicable
  holds: true
  reason: Always-on; intent classification has published benchmark tables.
- angle_id: a4
  precondition: always applicable
  holds: true
  reason: Always-on; the method axis carries architectures a recency walk can search on.
- angle_id: a5
  precondition: always applicable
  holds: true
  reason: Always-on; every major vendor publishes a hosted model for these three tasks.
- angle_id: b1
  precondition: 'data_ml.ml_involvement in {fine-tunes, trains-from-scratch, multi-model} — the three
    values whose projects actually pay for a training run

    '
  holds: true
  reason: The scope declares ml_involvement = uses-pre-trained, which is NOT in b1's set — but several
    of the models a1 will find publish fine-tuning cost figures, so the angle has material to work with
    and is worth running.
- angle_id: b2
  precondition: 'regulatory.applies = true OR data_ml.eu_ai_act.risk_level in {unacceptable, high}

    '
  holds: false
  reason: 'The scope declares regulatory.applies = false, and eu_ai_act.risk_level = limited, which
    is in neither leg. BOTH legs fail, which is what makes the verdict false — the first leg alone would
    have decided it either way.

    '
- angle_id: b3
  precondition: 'scale.real_time in {near, hard} OR scale.concurrency in {high, extreme} OR scale.availability_target
    in {"99.99", "99.999"}

    '
  holds: false
  reason: 'The scope declares real_time = none (triage runs on a queue, not in the request path), concurrency
    = moderate, and availability_target = 99.9. All three legs fail.

    '
- angle_id: b4
  precondition: 'scale.geo_distribution = "edge" OR archetype.primary in {mobile-app, embedded-iot,
    desktop-app, browser-extension}

    '
  holds: false
  reason: 'The scope declares geo_distribution = single-region and archetype.primary = web-app, which
    is in neither set. Nothing runs on a constrained device.

    '
