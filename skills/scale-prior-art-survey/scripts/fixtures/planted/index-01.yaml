# WHY: An area `confidence` stronger than its weakest backing episode. It is re-derived as the WEAKEST class, never averaged.
schema_version: 1
version: 1
as_of: '2026-09-05'
project_band:
  concurrency: moderate
  real_time: none
  availability_target: '99'
  geo_distribution: single-region
  data_volume: large
lineage:
  extends: null
areas:
- area: primary-datastore
  default_pattern: Single-node columnar engine with an explicit spill-to-disk budget.
  evidence:
  - techempower-run-3#e1
  - techempower-run-3#e2
  confidence: high
  hard_limits:
