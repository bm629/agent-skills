registry_version: 1
updated: '2026-09-05'
probe_default:
  method: GET
  headers: {}
  user_agent: default
  note: 'GET, never HEAD — a HEAD status is not evidence about a row. Measured in a sibling registry:
    three of twenty-two rows answer different statuses to the two methods.

    '
type_trigger:
  formula: scale.concurrency in {high, extreme} OR scale.real_time in {near, hard} OR scale.availability_target
    in {99.99, 99.999} OR scale.geo_distribution in {multi-region, global, edge} OR scale.data_volume
    in {large, extreme}
  source: capability-map classification, the five REQUIRED scale.* leaves. Transcribed from the shared
    trigger engine's SCALE_TRIGGER (tests/test_trigger_engine_rules.py:34-46), leg for leg.
  predicate:
  - - field: scale.concurrency
      op: in
      values:
      - high
      - extreme
  - - field: scale.real_time
      op: in
      values:
      - near
      - hard
  - - field: scale.availability_target
      op: in
      values:
      - '99.99'
      - '99.999'
  - - field: scale.geo_distribution
      op: in
      values:
      - multi-region
      - global
      - edge
  - - field: scale.data_volume
      op: in
      values:
      - large
      - extreme
coherence_axioms: []
coherence_axioms_note: 'Deliberately empty. This type''s trigger is a flat five-way disjunction over five
  INDEPENDENT required leaves — no leaf constrains another, so there is no axiom to state. An empty block
  with no note reads as an omission, which is why this line exists.

  '
angles:
- id: a1
  mechanism: First-party engineering-narrative retrieval. Walks the discovery and curated indexes for
    published scaling narratives, and records one coverage cell per (group, source).
  applicable_group_types:
  - system-class
  - load-dimension
  - named-technology
  sources:
  - hn-algolia
  - awesome-scalability-index
  - engineering-blogs-index
  - highscalability-archive
  - github-blog
  - infoq
  - open-engineering-blogs
  cap: 40
  cap_rationale: 'A BUDGET, not a measurement. The long tail is unbounded — hn-algolia is a live full-text
    index and open-engineering-blogs is per-host — so no count clears it; 40 is what one child can read
    at depth. `hit: true` is this angle''s normal path.'
  ordering_signal: 'Recency of the narrative (published date descending), then the source''s own listing
    order. Both signals exist for every source this angle walks: each index carries a date and every listing
    has an order.'
  trigger: always
  precondition: always
  fallback: awesome-scalability-index
  fallback_rationale: When discovery is unreachable the curated index still yields case studies by category,
    which is the same corpus reached a different way.
  predicate: null
  trigger_anchor: []
  widening_legs: []
  predicate_omits: []
  seed_input:
  - system-class
  - load-dimension
  - named-technology
- id: a2
  mechanism: Peer-reviewed systems-literature retrieval. Walks the proceedings and preprint listings and
    the DOI layer for measured systems results.
  applicable_group_types:
  - system-class
  - load-dimension
  sources:
  - usenix
  - pvldb
  - arxiv-listing
  - crossref
  - semantic-scholar
  cap: 45
  cap_rationale: A BUDGET. Two of the five sources are unbounded APIs and arxiv-listing is a recency window,
    so the union cannot be counted; 45 is sized to one child's reading depth over five channels.
  ordering_signal: Citation count descending where the source exposes one, then publication date descending.
    Crossref and semantic-scholar both expose citations; usenix, pvldb and arxiv expose dates, so the
    tie-break is total over every source this angle walks.
  trigger: always
  precondition: always
  fallback: crossref
  fallback_rationale: When a proceedings listing cannot be walked, the DOI layer still resolves the same
    papers.
  predicate: null
  trigger_anchor: []
  widening_legs: []
  predicate_omits: []
  seed_input:
  - system-class
  - load-dimension
- id: a3
  mechanism: Operational-canon retrieval. Walks the four governed first-party operational corpora for
    the documented practice a scaling decision is measured against.
  applicable_group_types:
  - failure-class
  - system-class
  sources:
  - sre-google
  - aws-builders-library
  - azure-architecture-center
  - gcp-architecture-framework
  cap: 184
  cap_rationale: 'MEASURED 2026-09-04, not budgeted: the four governed corpora count 44 (SRE Book) + 30
    (SRE Workbook) + 44 (Azure Cloud Design Patterns) + 66 (GCP Architecture Framework) = 184. A cap below
    an angle''s enumerable set truncates a corpus it could have walked, so the cap rose from 25 to 184.
    The AWS Builders'' Library is excluded from the count because its listing is not isolable by fetch.'
  ordering_signal: The source's own listing order, then the corpus's declaration order in `sources` above.
    Every one of the four is a walkable listing, so listing order is total here in a way recency is not
    — three of the four publish no per-page date.
  trigger: always
  precondition: always
  fallback: azure-architecture-center
  fallback_rationale: The pattern catalogue is the countable corpus when the Builders' Library listing
    cannot be isolated.
  predicate: null
  trigger_anchor: []
  widening_legs: []
  predicate_omits: []
  seed_input:
  - failure-class
  - system-class
  sizing_record:
    sizing_class: enumerable-union
    parts:
    - source: sre-google
      count: 44
      note: SRE Book chapters
    - source: sre-google
      count: 30
      note: SRE Workbook chapters
    - source: azure-architecture-center
      count: 44
      note: Cloud Design Patterns
    - source: gcp-architecture-framework
      count: 66
      note: Architecture Framework reliability + performance pages
    sum: 184
    note: aws-builders-library carries no isolable listing and is therefore not a part of this union;
      a cap cannot be sized against what cannot be counted.
- id: b1
  mechanism: Tail-latency and real-time evidence retrieval. Walks the literature and component documentation
    for measured latency distributions and the configurations that produced them.
  applicable_group_types:
  - named-technology
  - load-dimension
  sources:
  - usenix
  - arxiv-listing
  - component-docs
  - techempower
  - hn-algolia
  cap: 30
  cap_rationale: A BUDGET. component-docs is per-vendor and hn-algolia is unbounded, so no union exists
    to count.
  ordering_signal: Measured-percentile depth first (a source reporting p99 or beyond outranks one reporting
    a mean), then publication date descending. Both are readable on every source this angle walks.
  trigger: conditional
  precondition: scale.real_time in {soft, near, hard} OR scale.latency_sensitive
  fallback: usenix
  fallback_rationale: Peer-reviewed proceedings carry the measured distributions when a vendor's own documentation
    states only a target.
  predicate:
  - - field: scale.real_time
      op: in
      values:
      - soft
      - near
      - hard
  - - field: scale.latency_sensitive
      op: is_true
  trigger_anchor:
  - scale.real_time
  widening_legs:
  - scale.latency_sensitive
  predicate_omits:
  - scale.throughput — a throughput requirement does not by itself imply a tail-latency obligation, and
    b5 owns that ground.
  seed_input:
  - named-technology
  - load-dimension
- id: b2
  mechanism: Geo-distribution and consistency evidence retrieval. Walks the literature and the independent
    safety analyses for what a replication topology actually guarantees.
  applicable_group_types:
  - named-technology
  - system-class
  sources:
  - pvldb
  - jepsen-analyses
  - jepsen-consistency
  - crossref
  - component-docs
  cap: 25
  cap_rationale: A BUDGET. The literature is unbounded through crossref and component-docs is per-vendor.
  ordering_signal: Independence of the evidence first (an adversarial third-party analysis outranks a
    vendor claim), then publication date descending. Both readable on all five sources.
  trigger: conditional
  precondition: scale.geo_distribution in {multi-region, global, edge} OR regulatory.applies OR scale.consistency
    in {strong, linearizable}
  fallback: pvldb
  fallback_rationale: Peer-reviewed work covers the same replication and consistency ground when an analysis
    has not been published for a component.
  predicate:
  - - field: scale.geo_distribution
      op: in
      values:
      - multi-region
      - global
      - edge
  - - field: regulatory.applies
      op: is_true
  - - field: scale.consistency
      op: in
      values:
      - strong
      - linearizable
  trigger_anchor:
  - scale.geo_distribution
  - regulatory.applies
  widening_legs:
  - scale.consistency
  predicate_omits:
  - scale.data_volume — volume drives partitioning, not the replication topology this angle is about.
  seed_input:
  - named-technology
  - system-class
- id: b3
  mechanism: Incident and post-mortem retrieval. Walks the curated index, the first-party event summaries
    and the provider status histories for what actually failed under load.
  applicable_group_types:
  - failure-class
  sources:
  - post-mortems-index
  - aws-post-event
  - gcp-status
  - azure-status-history
  - cloudflare-outage-tag
  - hn-algolia
  cap: 30
  cap_rationale: 'A BUDGET, and the corpus WAS measured: at least 104 load-caused entries across two of
    the six listings, and two of the six are unbounded time series — so no number clears the corpus and
    30 stands as a budget. Its ordering is therefore load-bearing rather than decorative.'
  ordering_signal: Blast radius first (entries stating a wider user or region impact outrank narrower
    ones), then recency. Both are readable on every one of the six.
  trigger: conditional
  precondition: scale.availability_target in {"99.95", "99.99", "99.999"} OR scale.concurrency in {high,
    extreme} OR scale.burst_traffic OR scale.stateful
  fallback: aws-post-event
  fallback_rationale: First-party event summaries remain when a curated index goes stale.
  predicate:
  - - field: scale.availability_target
      op: in
      values:
      - '99.95'
      - '99.99'
      - '99.999'
  - - field: scale.concurrency
      op: in
      values:
      - high
      - extreme
  - - field: scale.burst_traffic
      op: is_true
  - - field: scale.stateful
      op: is_true
  trigger_anchor:
  - scale.availability_target
  - scale.concurrency
  widening_legs:
  - scale.burst_traffic
  - scale.stateful
  predicate_omits:
  - scale.real_time — a latency obligation is not by itself an availability obligation, and b1 owns it.
  seed_input:
  - failure-class
  sizing_record:
    sizing_class: budget-floor
    floor: 104
    matcher: Entries whose stated cause names load, saturation, capacity, throttling or cascading failure
      — applied to post-mortems-index and cloudflare-outage-tag, the two of six that expose a walkable
      listing.
    listings_covered: 2
    note: gcp-status and azure-status-history are unbounded time series and aws-post-event has no listing
      at all, so the floor is a floor and not a union. 104 exceeds the cap of 30, which is why the ordering
      is load-bearing.
- id: b4
  mechanism: Capacity-envelope retrieval. Walks the published provider and component limits for the hard
    numbers a design has to live inside.
  applicable_group_types:
  - named-technology
  - system-class
  sources:
  - docs-aws-quotas
  - azure-limits
  - gcp-quotas
  - kubernetes-docs
  - component-docs
  cap: 25
  cap_rationale: A BUDGET. component-docs is per-vendor, so the union depends on which components the
    scope names and cannot be counted in advance.
  ordering_signal: The source's own listing order, then the declaration order in `sources` above. Limits
    pages publish no dates and no ranking, so listing order is the only signal total across all five.
  trigger: conditional
  precondition: archetype.primary not in {cli-tool, library-sdk, desktop-app, browser-extension} OR integrations.expected
    OR archetype.secondary INTERSECTS {api-service, web-app, ml-service, infra-platform, data-pipeline}
  fallback: component-docs
  fallback_rationale: When a provider's limits page is unreachable the component's own documentation still
    publishes its ceilings.
  predicate:
  - - field: archetype.primary
      op: not_in
      values:
      - cli-tool
      - library-sdk
      - desktop-app
      - browser-extension
  - - field: integrations.expected
      op: is_true
  - - field: archetype.secondary
      op: contains
      values:
      - api-service
      - web-app
      - ml-service
      - infra-platform
      - data-pipeline
  trigger_anchor:
  - archetype.primary
  - integrations.expected
  widening_legs:
  - archetype.secondary
  predicate_omits:
  - business.platform — being a platform implies tenancy questions, which are b7's, not capacity ceilings.
  seed_input:
  - named-technology
  - system-class
- id: b5
  mechanism: Independent benchmark retrieval. Walks the audited and continuously-run public benchmarks
    for throughput evidence with its configuration disclosed.
  applicable_group_types:
  - named-technology
  - load-dimension
  sources:
  - tpc-results
  - spec-results
  - techempower
  - clickbench
  - crossref
  cap: 20
  cap_rationale: A BUDGET. crossref is unbounded and the benchmark rounds are re-run continuously, so
    a union counted today expires.
  ordering_signal: Configuration completeness first (a result disclosing hardware and tuning outranks
    a bare number — the full-disclosure discipline `configuration_stated` records), then result date descending.
    Both readable on all five.
  trigger: conditional
  precondition: scale.data_volume in {large, extreme} OR scale.concurrency in {high, extreme} OR scale.throughput
    in {high, extreme}
  fallback: techempower
  fallback_rationale: A continuously-run public benchmark covers the same ground when an audited result
    does not exist for the component.
  predicate:
  - - field: scale.data_volume
      op: in
      values:
      - large
      - extreme
  - - field: scale.concurrency
      op: in
      values:
      - high
      - extreme
  - - field: scale.throughput
      op: in
      values:
      - high
      - extreme
  trigger_anchor:
  - scale.data_volume
  - scale.concurrency
  widening_legs:
  - scale.throughput
  predicate_omits:
  - scale.real_time — b1 owns latency; a throughput benchmark is not a tail-latency measurement.
  seed_input:
  - named-technology
  - load-dimension
- id: b6
  mechanism: Inference-serving scale retrieval. Walks the literature and component documentation for measured
    serving throughput, batching behaviour and accelerator utilisation.
  applicable_group_types:
  - named-technology
  - load-dimension
  sources:
  - arxiv-listing
  - crossref
  - component-docs
  - hn-algolia
  - usenix
  cap: 25
  cap_rationale: A BUDGET. Two of the five are unbounded APIs and component-docs is per-vendor.
  ordering_signal: Publication date descending — this corpus moves faster than any other this type walks
    — then the source's listing order. Both readable on all five.
  trigger: conditional
  precondition: data_ml.ml_involvement != "none"
  fallback: crossref
  fallback_rationale: DOI metadata reaches the same preprints and papers when a listing is a recency window.
  predicate:
  - - field: data_ml.ml_involvement
      op: neq
      values:
      - none
  trigger_anchor:
  - data_ml.ml_involvement
  widening_legs: []
  predicate_omits:
  - scale.data_volume — training-data volume is not serving load, and b5 owns throughput evidence.
  seed_input:
  - named-technology
  - load-dimension
- id: b7
  mechanism: Multi-tenant and platform-scale retrieval. Walks the operational canon and the literature
    for isolation mechanisms, per-tenant fairness and noisy-neighbour handling.
  applicable_group_types:
  - system-class
  - failure-class
  sources:
  - aws-builders-library
  - usenix
  - pvldb
  - crossref
  - azure-architecture-center
  cap: 20
  cap_rationale: 'A BUDGET, and the corpus was measured to be UNCOUNTABLE: neither corpus its sizing names
    can be counted — the Builders'' Library subset is not isolable and the isolation literature is unbounded
    under a keyword query.'
  ordering_signal: Independence first (peer-reviewed or third-party work outranks a provider's own account
    of its own isolation), then publication date descending. Both readable on all five.
  trigger: conditional
  precondition: business.platform.type != "none" OR domain.audience in {b2b, b2b2c} OR security.authz_complexity
    == "multi-tenant-isolation"
  fallback: usenix
  fallback_rationale: Proceedings carry the isolation literature when a first-party essay cannot be isolated
    from its listing.
  predicate:
  - - field: business.platform.type
      op: neq
      values:
      - none
  - - field: domain.audience
      op: in
      values:
      - b2b
      - b2b2c
  - - field: security.authz_complexity
      op: eq
      values:
      - multi-tenant-isolation
  trigger_anchor:
  - business.platform.type
  - domain.audience
  widening_legs:
  - security.authz_complexity
  predicate_omits:
  - scale.concurrency — concurrency is load, not tenancy; b3 and b5 own it.
  seed_input:
  - system-class
  - failure-class
  sizing_record:
    sizing_class: budget-uncountable
    corpora:
    - source: aws-builders-library
      reason: 'The multi-tenancy subset of the library is not isolable by fetch: the listing does not
        expose a topic filter and the essays carry no machine-readable tag.'
    - source: usenix
      reason: The isolation literature is unbounded under a keyword query — there is no governed set whose
        members could be counted.
    note: Both named corpora are uncountable, so 20 is a budget and the independence-then-recency ordering
      is what decides what gets read.
sources:
- id: hn-algolia
  url: https://hn.algolia.com/api/v1/search
  url_kind: json-api
  access_status: open
  authority_band: aggregator
  as_of: '2026-08-22'
  yields: Full-text hits across HN stories and comments; the practical index of the engineering-blog long
    tail. Key-less, JSON, paginated.
  complete_listing: false
  fallback: awesome-scalability-index
  fallback_rationale: An unbounded live index; when it is unreachable a curated static index still yields
    case studies by category.
- id: awesome-scalability-index
  url: https://raw.githubusercontent.com/binhnguyennus/awesome-scalability/master/README.md
  url_kind: raw-file
  access_status: open
  authority_band: community
  as_of: '2026-08-22'
  yields: A single curated README of scalability case studies grouped by category; one fetch returns the
    whole index.
  complete_listing: true
  fallback: engineering-blogs-index
  fallback_rationale: Both are curated static indexes of the same corpus; the blog list is the wider,
    staler one.
- id: engineering-blogs-index
  url: https://raw.githubusercontent.com/kilimchoi/engineering-blogs/master/README.md
  url_kind: raw-file
  access_status: open
