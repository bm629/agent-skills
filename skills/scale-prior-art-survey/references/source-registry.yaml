- id: netflixtechblog
  url: https://netflixtechblog.com
  cause_class: refused
  cause: HTTP 403 to every fetch on 2026-08-22, browser UA included. Named as a primary source by the
    founding survey and excluded here on observable evidence.
- id: linkedin-engineering
  url: https://engineering.linkedin.com
  cause_class: excluded-on-robots
  cause: '301s to a host whose catch-all is verbatim `Disallow: /`, read 2026-08-22.'
- id: acm-digital-library
  url: https://dl.acm.org
  cause_class: refused
  cause: 'HTTP 403, unchanged from an earlier survey''s 2026-08-04 finding. Excluded as a FETCH TARGET
    only: an ACM DOI stays resolvable through crossref.'
- id: acm-queue
  url: https://queue.acm.org
  cause_class: refused
  cause: HTTP 403 on 2026-08-22 — the same posture as the DL but a different host, recorded separately
    so it is not re-probed as an oversight.
- id: openalex
  url: https://api.openalex.org
  cause_class: refused
  cause: Key-mandatory and billed since 2026-02-13; the polite pool was discontinued. INHERITED FROM AN
    EARLIER SURVEY AND NOT RE-PROBED — flagged as inherited because this registry argues that verification
    dates are load-bearing, and this is the one row whose date is not its own.
- id: iso-25010
  url: https://www.iso.org/standard/78176.html
  cause_class: refused
  cause: HTTP 403; two mirrors 404. The standard exists and is externally owned, but its normative content
    is not fetchable.
- id: github-html
  url: https://github.com
  cause_class: excluded-on-robots
  cause: HTTP 429 on probe, and the catch-all disallows /*/tree/, /*/raw/, /*/archive/ and /search$. Raw
    file fetches through raw.githubusercontent.com are a different host and are admitted.
