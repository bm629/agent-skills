# Every rule id the validator emits, mapped to the PLAN TASK that owns it.
#
# Build metadata mapping into another repository's task ids, so no producer instruction and no
# reviewer condition could honestly name it -- the ONE declared exclusion from SKILL.md's
# both-directions reference sweep, asserted in both directions there.
#
# The ids are per-CLAUSE, not per-family. A composite id cannot say WHICH clause a task owns,
# and family-level ids gave 41 against seventy rule-bearing clauses.
#
# Asserted EQUAL to the ids the AST yields, over BOTH call shapes: a positional
# `_fail("id", ...)` and a `rule=` keyword threaded through a helper. `registry-unreadable`
# reaches `_fail` only the second way, and a positional-only walk reported it missing.
#
# No text search could do this: `schema`, `bound`, `admission`, `input` and `synthesis` all
# match ordinary prose, and two of them are ids a sibling validator really emits.
